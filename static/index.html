<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="卡路里记录">
<meta name="theme-color" content="#dce8f5">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<title>卡路里记录</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --blue-1: #dce8f5;
  --blue-2: #b8cfeb;
  --blue-3: #79aed4;
  --blue-4: #4a90b8;
  --blue-5: #3a7198;
  --blue-6: #2d5778;
  --teal: #4faeb4;
  --green: #58b899;
  --red: #e06060;
  --text: #364c63;
  --text2: #7e94a8;
  --text3: #a0b3c4;
  --bg: #e8f1f7;
  --card: rgba(255,255,255,0.88);
  --border: #c8ddef;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  padding-top: calc(16px + var(--safe-top));
  padding-bottom: calc(80px + var(--safe-bottom));
  overflow-x: hidden;
}

.header {
  background: linear-gradient(160deg, #4a95b8, #52a3c4 40%, #4fa0c0 100%);
  color: #fff;
  margin: 0 16px;
  padding: 20px 20px 16px;
  border-radius: 24px;
  position: relative;
  z-index: 1;
}
.header h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.header .date-row {
  display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px;
}
.date-row .arrow {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.2); color: #fff; font-size: 15px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: .2s; flex-shrink: 0;
}
.date-row .arrow:active { background: rgba(255,255,255,0.4); }
.date-row .date-text { flex: 1; text-align: center; font-weight: 600; }
.date-row .today-btn {
  background: rgba(255,255,255,0.22); border: none; color: #fff;
  padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: .2s;
}
.today-btn:active { background: rgba(255,255,255,0.4); }

.summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin: 14px 16px 0;
}
.summary-item {
  background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 18px; padding: 14px 6px; text-align: center;
  border: 1px solid rgba(255,255,255,0.6);
}
.summary-item .num {
  font-size: 26px; font-weight: 900; transition: .3s;
}
.summary-item:nth-child(1) .num { color: #4a90b8; }
.summary-item:nth-child(2) .num { color: #4faeb4; }
.summary-item:nth-child(3) .num { color: #58b899; }
.summary-item:nth-child(4) .num { color: #6a9cc0; }
.summary-item .num.over { color: var(--red) !important; }
.summary-item .label { font-size: 10px; color: var(--text2); margin-top: 3px; font-weight: 500; }

.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: rgba(245,249,253,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.06);
  display: flex; padding-bottom: var(--safe-bottom);
}
.tab-btn {
  flex: 1; padding: 10px 0 6px; border: none; background: none;
  cursor: pointer; text-align: center; color: var(--text2);
  font-size: 11px; font-weight: 600; transition: .2s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tab-btn .icon { font-size: 22px; }
.tab-btn.active { color: #4a90b8; }
.tab-btn:active { opacity: 0.6; }

.page { display: none; padding: 0 16px; margin-top: 12px; }
.page.show { display: block; }

.card {
  background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 20px; padding: 18px; border: 1px solid rgba(255,255,255,0.6);
  margin-bottom: 12px;
}
.card h2 {
  font-size: 16px; font-weight: 800; color: var(--blue-5); margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 2px dotted var(--border); letter-spacing: 1px;
}

.search-box {
  position: relative; margin-bottom: 10px;
}
.search-box::before {
  content: '🔍'; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); font-size: 14px; z-index: 1; pointer-events: none;
}
.search-box input {
  width: 100%; padding: 11px 14px 11px 36px;
  border: 2px solid var(--border); border-radius: 16px;
  font-size: 14px; outline: none; background: #f4f8fc; color: var(--text);
  font-weight: 500; transition: .2s;
}
.search-box input:focus { border-color: var(--blue-3); background: #fff; }
.search-box input::placeholder { color: var(--text3); }

.cat-scroll {
  display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; padding-bottom: 4px;
  scrollbar-width: none;
}
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-chip {
  padding: 6px 14px; border-radius: 18px; border: 1.5px solid var(--border);
  background: rgba(255,255,255,0.7); cursor: pointer;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--text2); transition: .2s; flex-shrink: 0;
}
.cat-chip:active { transform: scale(0.94); }
.cat-chip.active {
  background: linear-gradient(135deg, #55b4c9, #4a90b8);
  color: #fff; border-color: transparent; font-weight: 700;
}

.food-list { max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.food-list::-webkit-scrollbar { width: 4px; }
.food-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.food-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; cursor: pointer; border-radius: 12px; transition: .15s;
  margin-bottom: 1px;
}
.food-row:active { background: #e8f1f9; }
.food-row .name { font-size: 14px; font-weight: 600; }
.food-row .cal {
  font-size: 11px; color: var(--text2); background: #edf4fa;
  padding: 3px 10px; border-radius: 10px; font-weight: 500; flex-shrink: 0;
}

.sheet-overlay {
  position: fixed; inset: 0; background: rgba(30,50,70,0.4); z-index: 80;
  display: flex; align-items: flex-end; visibility: hidden; transition: visibility .3s;
}
.sheet-overlay.show { visibility: visible; }
.sheet-overlay .sheet-bg { position: absolute; inset: 0; }
.sheet-panel {
  position: relative; background: #fff; border-radius: 22px 22px 0 0;
  width: 100%; max-height: 75vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 8px 20px calc(20px + var(--safe-bottom));
  transform: translateY(100%); transition: transform .3s cubic-bezier(0.32, 0.72, 0, 1);
}
.sheet-overlay.show .sheet-panel { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; background: #d0d8e0; border-radius: 2px;
  margin: 8px auto 14px;
}
.sheet-panel h3 { font-size: 17px; font-weight: 800; color: var(--blue-5); margin-bottom: 14px; }
.sheet-panel .sel-food {
  font-size: 13px; color: var(--text2); background: #f0f5fa;
  padding: 8px 14px; border-radius: 12px; margin-bottom: 12px;
}
.sheet-panel .sel-food strong { color: var(--blue-6); }
.sheet-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.sheet-row input, .sheet-row select {
  padding: 10px 14px; border: 2px solid var(--border); border-radius: 14px;
  font-size: 14px; outline: none; background: #f6fafd; color: var(--text);
  font-weight: 500; transition: .2s;
}
.sheet-row input:focus, .sheet-row select:focus { border-color: var(--blue-3); background: #fff; }
.sheet-row input { width: 90px; }
.sheet-row select { flex: 1; }
.sheet-kcal {
  font-size: 18px; font-weight: 900; color: var(--blue-4); white-space: nowrap;
}
.sheet-label { font-size: 12px; color: var(--text2); font-weight: 500; }
.btn {
  padding: 11px 20px; border: none; border-radius: 16px; cursor: pointer;
  font-size: 14px; font-weight: 700; letter-spacing: 1px; transition: .2s;
}
.btn:active { transform: scale(0.94); }
.btn-primary {
  width: 100%; background: linear-gradient(135deg, #55b4c9, #4a90b8);
  color: #fff; padding: 13px; font-size: 15px; margin-top: 6px;
}
.btn-secondary {
  background: #eaf2f9; color: var(--blue-5); font-size: 13px; padding: 8px 16px;
  border-radius: 12px; font-weight: 600;
}

.record-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.record-header h2 { margin: 0; padding: 0; border: none; }
.record-actions { display: flex; gap: 6px; }

.meal-group { margin-bottom: 14px; }
.meal-title {
  font-size: 13px; font-weight: 700; color: var(--blue-5); margin-bottom: 6px;
  padding: 8px 14px; background: #eef4fa; border-radius: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.meal-total { font-weight: 800; color: #4faeb4; font-size: 14px; }
.rec-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: rgba(255,255,255,0.5); border-radius: 12px;
  margin-bottom: 4px; font-size: 14px; transition: .15s;
}
.rec-item:active { background: rgba(255,255,255,0.9); }
.rec-item .info { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-item .sub { color: var(--text2); font-size: 11px; margin-left: 6px; display: inline; }
.rec-item .kcal { font-weight: 800; color: var(--blue-4); margin: 0 10px; flex-shrink: 0; font-size: 14px; }
.del-btn {
  width: 28px; height: 28px; border-radius: 50%; border: none; background: none;
  color: #d08080; font-size: 16px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: .15s;
}
.del-btn:active { background: #fdf2f2; }
.empty-msg { text-align: center; color: var(--text3); padding: 20px; font-size: 13px; }

.goal-row {
  display: flex; gap: 8px; align-items: center; margin-bottom: 12px; display: none;
}
.goal-row.show { display: flex; }
.goal-row input {
  width: 85px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px;
  font-size: 13px; outline: none; background: #f6fafd; color: var(--text); font-weight: 600;
}
.goal-row input:focus { border-color: var(--blue-3); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(30,50,70,0.35); z-index: 90;
  display: flex; align-items: center; justify-content: center;
  visibility: hidden; transition: visibility .2s;
}
.modal-overlay.show { visibility: visible; }
.modal-overlay .modal-bg { position: absolute; inset: 0; }
.modal-box {
  position: relative; background: #fff; border-radius: 22px; padding: 24px;
  width: 88vw; max-width: 380px; transform: scale(0.9); opacity: 0;
  transition: transform .25s, opacity .25s;
}
.modal-overlay.show .modal-box { transform: scale(1); opacity: 1; }
.modal-box h3 { font-size: 18px; font-weight: 800; color: var(--blue-5); margin-bottom: 16px; }
.modal-row { display: flex; gap: 8px; margin-bottom: 10px; }
.modal-box input, .modal-box select {
  flex: 1; padding: 10px 14px; border: 2px solid var(--border); border-radius: 14px;
  font-size: 14px; outline: none; background: #f6fafd; color: var(--text); font-weight: 500;
}
.modal-box input:focus, .modal-box select:focus { border-color: var(--blue-3); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.toast {
  position: fixed; top: calc(20px + var(--safe-top)); left: 50%; transform: translateX(-50%);
  background: var(--blue-6); color: #fff; padding: 10px 22px; border-radius: 20px;
  font-size: 13px; font-weight: 600; z-index: 100; pointer-events: none;
  opacity: 0; transition: opacity .3s;
}
.toast.show { opacity: 1; }

.loading { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <h1>🍰 今天吃了啥？</h1>
  <div class="date-row">
    <button class="arrow" onclick="changeDate(-1)">◀</button>
    <span class="date-text" id="dateDisplay"></span>
    <button class="arrow" onclick="changeDate(1)">▶</button>
    <button class="today-btn" onclick="goToday()">今天</button>
  </div>
</div>

<div class="summary">
  <div class="summary-item">
    <div class="num" id="totalCal">0</div>
    <div class="label">🍽️ 摄入</div>
  </div>
  <div class="summary-item">
    <div class="num" id="totalItems">0</div>
    <div class="label">📝 条数</div>
  </div>
  <div class="summary-item">
    <div class="num" id="remainCal">-</div>
    <div class="label">💚 还能吃</div>
  </div>
  <div class="summary-item">
    <div class="num" id="mealCount">0</div>
    <div class="label">🍱 餐次</div>
  </div>
</div>

<div class="page show" id="pageRecords">
  <div class="card">
    <div class="record-header">
      <h2>📋 今天的战绩</h2>
      <div class="record-actions">
        <button class="btn btn-secondary" onclick="toggleGoalEdit()">🎯 目标</button>
        <button class="btn btn-secondary" style="color:#d08080;" onclick="clearToday()">🗑️</button>
      </div>
    </div>
    <div class="goal-row" id="goalRow">
      <span style="font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;">每日目标：</span>
      <input type="number" id="goalInput" placeholder="2000" min="500" max="10000">
      <span style="font-size:12px;font-weight:600;color:var(--text2);">kcal</span>
      <button class="btn btn-secondary" onclick="saveGoal()" style="font-size:12px;">保存</button>
    </div>
    <div id="recordsContainer"><div class="empty-msg">加载中...</div></div>
  </div>
</div>

<div class="page" id="pageFoods">
  <div class="card">
    <h2>🍱 吃什么好呢~</h2>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜搜你想吃的~" oninput="renderFoodList()">
    </div>
    <div class="cat-scroll" id="catScroll"></div>
    <div class="food-list" id="foodList"></div>
    <button class="btn btn-primary" style="margin-top:8px;font-size:13px;padding:10px;" onclick="openCustomFood()">✨ 添加自定义食物</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchPage('records')">
    <span class="icon">📋</span>今日记录
  </button>
  <button class="tab-btn" onclick="switchPage('foods')">
    <span class="icon">🍱</span>食物库
  </button>
</div>

<div class="sheet-overlay" id="addSheet">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3>✨ 记录这一笔</h3>
    <div class="sel-food">已选：<strong id="selName"></strong>（<span id="selCal100"></span> kcal/100g）</div>
    <div class="sheet-row">
      <input type="number" id="amountInput" placeholder="分量" value="100" oninput="updateSheetPreview()">
      <select id="unitSelect" onchange="updateSheetPreview()">
        <option value="g">克 (g)</option>
        <option value="份">份</option>
        <option value="碗">碗</option>
        <option value="个">个</option>
        <option value="杯">杯</option>
      </select>
      <span class="sheet-kcal" id="sheetKcal">0 kcal</span>
    </div>
    <div class="sheet-row">
      <span class="sheet-label">⚖️ 每份参考重量：</span>
      <input type="number" id="portionWeight" value="100" style="width:70px;" oninput="updateSheetPreview()">
      <span class="sheet-label">g/份</span>
    </div>
    <div class="sheet-row">
      <span class="sheet-label">🍱 餐次：</span>
      <select id="mealSelect">
        <option value="早餐">早餐</option>
        <option value="午餐" selected>午餐</option>
        <option value="晚餐">晚餐</option>
        <option value="加餐">加餐</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="addRecord()">✅ 记录</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="customModal">
  <div class="modal-bg" onclick="closeCustomFood()"></div>
  <div class="modal-box">
    <h3>✨ 添加专属食物</h3>
    <div class="modal-row"><input type="text" id="customName" placeholder="食物名称"></div>
    <div class="modal-row">
      <input type="number" id="customCal" placeholder="每100g有多少热量？" style="flex:1;">
      <span style="font-size:12px;color:var(--text2);white-space:nowrap;align-self:center;">kcal/100g</span>
    </div>
    <div class="modal-row">
      <select id="customCat">
        <option value="自定义">分类：自定义</option>
        <option value="主食">主食</option><option value="肉类">肉类</option>
        <option value="蔬菜">蔬菜</option><option value="水果">水果</option>
        <option value="零食">零食</option><option value="饮品">饮品</option>
        <option value="中餐">中餐</option><option value="快餐">快餐</option>
        <option value="海鲜">海鲜</option><option value="豆蛋奶">豆蛋奶</option>
        <option value="调味酱料">调味酱料</option><option value="小吃早点">小吃早点</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCustomFood()">取消</button>
      <button class="btn btn-primary" style="width:auto;padding:10px 24px;" onclick="saveCustomFood()">保存</button>
    </div>
  </div>
</div>

const CATEGORIES = ['全部','主食','肉类','蔬菜','水果','豆蛋奶','海鲜','中餐','快餐','零食','饮品','小吃早点','调味酱料','自定义'];
const MEALS = ['早餐','午餐','晚餐','加餐'];

// ==================== 状态 ====================
let currentDate = new Date().toISOString().split('T')[0];
let activeCat = '全部';
let selectedFood = null;
let calorieGoal = 2000;
let customFoods = [];
let recordsCache = {};
let currentPage = 'records';

function dateKey() { return currentDate; }

async function api(path, options) {
  try {
    const res = await fetch(path, options);
    if (!res.ok) throw new Error('请求失败');
    return await res.json();
  } catch(e) {
    toast('⚠️ 网络出错，请刷新重试');
    throw e;
  }
}

async function loadRecords() {
  const data = await api('/api/records?date=' + currentDate);
  recordsCache = data;
}

async function loadCustomFoods() {
  customFoods = await api('/api/custom-foods');
}

async function loadGoal() {
  const data = await api('/api/goal');
  calorieGoal = data.goal;
}

// ==================== 页面切换 ====================
function switchPage(page) {
  currentPage = page;
  document.getElementById('pageRecords').classList.toggle('show', page === 'records');
  document.getElementById('pageFoods').classList.toggle('show', page === 'foods');
  const tabs = document.querySelectorAll('.tab-btn');
  tabs[0].classList.toggle('active', page === 'records');
  tabs[1].classList.toggle('active', page === 'foods');
  if (page === 'foods') renderFoodList();
}

// ==================== 食物列表 ====================
function renderCatScroll() {
  const container = document.getElementById('catScroll');
  container.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-chip${c===activeCat?' active':''}" onclick="selectCat('${c}')">${c}</button>`
  ).join('');
}

function renderFoodList() {
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
  let foods = [...FOOD_DB, ...customFoods];
  if (activeCat !== '全部') foods = foods.filter(f => f.cat === activeCat);
  if (query) foods = foods.filter(f => f.name.includes(query) || f.cat.includes(query));
  const container = document.getElementById('foodList');
  if (!foods.length) {
    container.innerHTML = '<div class="empty-msg">😢 没有找到呢~</div>';
    return;
  }
  container.innerHTML = foods.map(f =>
    `<div class="food-row" onclick="openFoodSheet('${f.name.replace(/'/g,"\\'")}', ${f.cal}, '${f.cat}')">
      <span class="name">${f.name}</span>
      <span class="cal">${f.cal} kcal/100g</span>
    </div>`
  ).join('');
}

function selectCat(cat) { activeCat = cat; renderCatScroll(); renderFoodList(); }

// ==================== 底部面板 ====================
function openFoodSheet(name, cal, cat) {
  selectedFood = { name, cal: parseFloat(cal), cat };
  document.getElementById('selName').textContent = name;
  document.getElementById('selCal100').textContent = cal;
  document.getElementById('amountInput').value = 100;
  document.getElementById('unitSelect').value = 'g';
  document.getElementById('portionWeight').value = 100;
  updateSheetPreview();
  document.getElementById('addSheet').classList.add('show');
}

function closeSheet() {
  document.getElementById('addSheet').classList.remove('show');
  selectedFood = null;
}

function updateSheetPreview() {
  if (!selectedFood) return;
  const amount = parseFloat(document.getElementById('amountInput').value) || 0;
  const unit = document.getElementById('unitSelect').value;
  const pw = parseFloat(document.getElementById('portionWeight').value) || 100;
  let m = unit === 'g' ? amount / 100 : (amount * pw) / 100;
  document.getElementById('sheetKcal').textContent = Math.round(selectedFood.cal * m) + ' kcal';
}

async function addRecord() {
  if (!selectedFood) return;
  const amount = parseFloat(document.getElementById('amountInput').value) || 0;
  const unit = document.getElementById('unitSelect').value;
  const pw = parseFloat(document.getElementById('portionWeight').value) || 100;
  if (amount <= 0) { toast('😅 请输入分量'); return; }
  let m = unit === 'g' ? amount / 100 : (amount * pw) / 100;
  const kcal = Math.round(selectedFood.cal * m);
  const mealType = document.getElementById('mealSelect').value;
  await api('/api/records', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      date: currentDate, mealType, name: selectedFood.name,
      amount, unit, kcal
    })
  });
  closeSheet();
  await loadRecords();
  renderRecords();
  renderSummary();
  toast('✅ 已记录 ' + kcal + ' kcal');
}

// ==================== 记录列表 ====================
async function deleteRecord(recordId) {
  await api('/api/records/' + recordId, { method: 'DELETE' });
  await loadRecords();
  renderRecords();
  renderSummary();
  toast('已删除');
}

function renderRecords() {
  let html = '';
  for (const meal of MEALS) {
    const items = recordsCache[meal] || [];
    const total = items.reduce((s, r) => s + r.kcal, 0);
    html += `<div class="meal-group">
      <div class="meal-title">${meal}<span class="meal-total">${total} kcal</span></div>`;
    if (!items.length) {
      html += '<div class="empty-msg">🍽️ 还没记录呢~</div>';
    } else {
      html += items.map(r => {
        const time = (r.time || '').slice(-5) || r.time || '';
        return `<div class="rec-item">
          <span class="info">${r.name}<span class="sub">${r.amount}${r.unit} · ${time}</span></span>
          <span class="kcal">${r.kcal} kcal</span>
          <button class="del-btn" onclick="deleteRecord(${r.id})">✕</button>
        </div>`;
      }).join('');
    }
    html += '</div>';
  }
  document.getElementById('recordsContainer').innerHTML = html;
}

function renderSummary() {
  let tc = 0, ti = 0, mc = 0;
  for (const meal of MEALS) {
    const items = recordsCache[meal] || [];
    tc += items.reduce((s, r) => s + r.kcal, 0);
    ti += items.length;
    if (items.length > 0) mc++;
  }
  document.getElementById('totalCal').textContent = tc;
  document.getElementById('totalCal').className = 'num' + (tc > calorieGoal ? ' over' : '');
  document.getElementById('totalItems').textContent = ti;
  document.getElementById('remainCal').textContent = calorieGoal - tc;
  document.getElementById('remainCal').className = 'num' + (tc > calorieGoal ? ' over' : '');
  document.getElementById('mealCount').textContent = mc;
}

// ==================== 日期导航 ====================
async function changeDate(delta) {
  const d = new Date(currentDate);
  d.setDate(d.getDate() + delta);
  currentDate = d.toISOString().split('T')[0];
  updateDateDisplay();
  await loadRecords();
  renderRecords();
  renderSummary();
}
async function goToday() {
  currentDate = new Date().toISOString().split('T')[0];
  updateDateDisplay();
  await loadRecords();
  renderRecords();
  renderSummary();
}
function updateDateDisplay() {
  const d = new Date(currentDate);
  const wd = ['日','一','二','三','四','五','六'];
  let txt = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${wd[d.getDay()]}`;
  if (currentDate === new Date().toISOString().split('T')[0]) txt += ' · 今天';
  document.getElementById('dateDisplay').textContent = txt;
}

// ==================== 自定义食物 ====================
function openCustomFood() {
  document.getElementById('customModal').classList.add('show');
  document.getElementById('customName').value = '';
  document.getElementById('customCal').value = '';
}
function closeCustomFood() { document.getElementById('customModal').classList.remove('show'); }
async function saveCustomFood() {
  const name = document.getElementById('customName').value.trim();
  const cal = parseFloat(document.getElementById('customCal').value);
  const cat = document.getElementById('customCat').value;
  if (!name || isNaN(cal) || cal <= 0) { toast('😅 请正确填写哦~'); return; }
  await api('/api/custom-foods', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, cal, cat })
  });
  await loadCustomFoods();
  closeCustomFood();
  renderFoodList();
  toast('✅ 已添加 ' + name);
}

// ==================== 目标 ====================
function toggleGoalEdit() {
  const row = document.getElementById('goalRow');
  row.classList.toggle('show');
  if (row.classList.contains('show')) document.getElementById('goalInput').value = calorieGoal;
}
async function saveGoal() {
  const val = parseInt(document.getElementById('goalInput').value);
  if (isNaN(val) || val < 500) { toast('请输入 ≥500 kcal'); return; }
  await api('/api/goal', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ goal: val })
  });
  calorieGoal = val;
  document.getElementById('goalRow').classList.remove('show');
  renderSummary();
  toast('🎯 目标已更新');
}
async function clearToday() {
  if (confirm('确定清空今天所有记录吗？')) {
    for (const meal of MEALS) {
      const items = recordsCache[meal] || [];
      for (const r of items) {
        await api('/api/records/' + r.id, { method: 'DELETE' });
      }
    }
    await loadRecords();
    renderRecords();
    renderSummary();
    toast('🗑️ 已清空');
  }
}

// ==================== Toast ====================
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

// ==================== 初始化 ====================
async function init() {
  updateDateDisplay();
  renderCatScroll();
  await Promise.all([loadGoal(), loadRecords(), loadCustomFoods()]);
  renderFoodList();
  renderRecords();
  renderSummary();
}
init();
</script>
